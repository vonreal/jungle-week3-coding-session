<svg width="680" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">Mini Redis 내부 구조</text>

  <!-- Outer container -->
  <rect x="40" y="48" width="600" height="248" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="72" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Mini Redis 서버</text>

  <!-- Hash table -->
  <rect x="70" y="92" width="260" height="80" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="200" y="120" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">해시 테이블 (핵심)</text>
  <text x="200" y="140" text-anchor="middle" font-size="11" fill="#0F6E56">직접 구현, 체이닝 충돌 해결</text>
  <text x="200" y="156" text-anchor="middle" font-size="11" fill="#0F6E56">GET / SET / DEL / keys</text>

  <!-- Concurrency -->
  <rect x="360" y="92" width="250" height="80" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="485" y="120" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">동시성 레이어</text>
  <text x="485" y="140" text-anchor="middle" font-size="11" fill="#185FA5">threading.RLock</text>
  <text x="485" y="156" text-anchor="middle" font-size="11" fill="#185FA5">원자적 읽기/쓰기 보장</text>

  <!-- TTL Manager -->
  <rect x="70" y="196" width="540" height="76" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="224" text-anchor="middle" font-size="13" font-weight="500" fill="#633806">TTL 만료 관리자</text>
  <text x="340" y="242" text-anchor="middle" font-size="11" fill="#854F0B">lazy expiry — 접근 시 만료 체크 (유통기한 확인)</text>
  <text x="340" y="258" text-anchor="middle" font-size="11" fill="#854F0B">periodic cleanup — 백그라운드 스레드가 1초마다 만료 키 정리</text>

  <!-- FastAPI -->
  <rect x="40" y="336" width="600" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="358" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">FastAPI REST API</text>
  <text x="340" y="376" text-anchor="middle" font-size="11" fill="#993C1D">POST /set · GET /get/{key} · DELETE /del/{key} · GET /keys · POST /run-tests</text>

  <line x1="340" y1="336" x2="340" y2="298" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Dashboard -->
  <rect x="40" y="420" width="600" height="76" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="340" y="444" text-anchor="middle" font-size="13" font-weight="500" fill="#72243E">대시보드 UI (단일 HTML)</text>

  <rect x="62" y="458" width="170" height="28" rx="6" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="147" y="476" text-anchor="middle" font-size="11" fill="#72243E">커맨드 패널</text>

  <rect x="254" y="458" width="170" height="28" rx="6" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="339" y="476" text-anchor="middle" font-size="11" fill="#72243E">키 목록 + TTL</text>

  <rect x="446" y="458" width="170" height="28" rx="6" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="531" y="476" text-anchor="middle" font-size="11" fill="#72243E">테스트 / 벤치마크</text>

  <line x1="340" y1="420" x2="340" y2="394" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="340" y="514" text-anchor="middle" font-size="12" fill="#5F5E5A">브라우저 → localhost:8000/dashboard</text>
  <line x1="340" y1="500" x2="340" y2="498" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>