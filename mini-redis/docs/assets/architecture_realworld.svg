<svg width="680" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">실제 서비스에서 Redis의 위치</text>

  <!-- Browser -->
  <rect x="255" y="50" width="170" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="74" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">브라우저 / 앱</text>

  <line x1="340" y1="90" x2="340" y2="120" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Web Server -->
  <rect x="220" y="122" width="240" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="144" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">웹 서버 (API)</text>
  <text x="340" y="162" text-anchor="middle" font-size="11" fill="#534AB7">FastAPI, Express, Spring 등</text>

  <!-- Branch to Redis -->
  <path d="M280 172 L280 208 L168 208 L168 238" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="184" y="200" font-size="11" fill="#5F5E5A">① 캐시 확인</text>

  <!-- Redis -->
  <rect x="68" y="240" width="200" height="80" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="168" y="266" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">Redis (캐시)</text>
  <text x="168" y="284" text-anchor="middle" font-size="11" fill="#993C1D">메모리 저장, O(1) 조회</text>
  <text x="168" y="300" text-anchor="middle" font-size="11" fill="#993C1D">같은 내부 네트워크, ~0.5ms</text>

  <!-- Cache hit return -->
  <path d="M108 240 L108 185 L220 185 L220 172" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="68" y="195" font-size="11" font-weight="500" fill="#0F6E56">캐시 히트!</text>

  <!-- Branch to DB -->
  <path d="M400 172 L400 274 L412 274" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="230" font-size="11" fill="#5F5E5A">② 캐시 미스</text>

  <!-- DB -->
  <rect x="414" y="240" width="218" height="80" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="523" y="266" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">데이터베이스</text>
  <text x="523" y="284" text-anchor="middle" font-size="11" fill="#185FA5">MySQL, PostgreSQL 등</text>
  <text x="523" y="300" text-anchor="middle" font-size="11" fill="#185FA5">디스크 I/O, ~5-50ms</text>

  <!-- DB return -->
  <path d="M523 320 L523 356 L340 356 L340 172" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="444" y="348" font-size="11" fill="#5F5E5A">③ 쿼리 결과</text>

  <!-- Cache save -->
  <path d="M340 356 L340 386 L168 386 L168 322" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="260" y="402" font-size="11" fill="#993C1D">④ 캐시에 저장</text>

  <!-- Network box -->
  <rect x="48" y="424" width="584" height="36" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 3"/>
  <text x="340" y="446" text-anchor="middle" font-size="12" font-weight="500" fill="#5F5E5A">내부 네트워크 (같은 VPC / 데이터센터)</text>

  <!-- Legend -->
  <line x1="68" y1="488" x2="108" y2="488" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="116" y="492" font-size="11" fill="#5F5E5A">요청 흐름</text>

  <line x1="250" y1="488" x2="290" y2="488" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="298" y="492" font-size="11" fill="#0F6E56">캐시 히트 (빠른 응답)</text>

  <line x1="460" y1="488" x2="500" y2="488" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="508" y="492" font-size="11" fill="#993C1D">캐시 저장</text>
</svg>